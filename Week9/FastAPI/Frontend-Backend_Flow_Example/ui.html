<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      padding: 10px 24px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .output {
      margin-top: 24px;
      padding: 16px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      min-height: 100px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <textarea placeholder="Enter your text..."></textarea>
    <button id="submit" onclick="submitText()">Submit</button>
    <div class="output"></div>
  </div>
</body>
<script>

    async function submitText() {
        const input_query = document.querySelector('textarea').value;
        const outputDiv = document.querySelector('.output');

        try {
            outputDiv.textContent = "Processing...";
            
            const response = await fetch("http://127.0.0.1:8000/query", {
            "method": "POST",
            "headers": {
                "Content-Type": "application/json"
            },
            "body": JSON.stringify({"text": input_query})
        });

        // This checks if the response is not ok (status code is not 200-299)
        // If not ok, it throws an error and the code goes to the catch block
        if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();

        outputDiv.textContent = data.result;
        }
        
        catch (error) {
            outputDiv.textContent = "Something went wrong. Please try again.";
        }
    }
</script>
</html>
