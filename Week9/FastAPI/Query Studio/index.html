<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QueryStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--font-d:'Playfair Display',serif;--font-b:'DM Sans',sans-serif;--font-m:'JetBrains Mono',monospace;--tr:.32s cubic-bezier(.4,0,.2,1)}

[data-theme="aurora"]{--bg-page:#f0f0fa;--bg-panel:#fff;--bg-hdr:#e8e6f8;--bg-in:#fafaff;--acc:#7c6fd8;--acc-s:#ede9ff;--acc-t:#4a3fa0;--tp:#1e1b3a;--ts:#6b65a0;--tm:#a09cc8;--bd:#d8d4f0;--bf:#7c6fd8;--sh:0 6px 32px rgba(124,111,216,.16);--tbg:#ede9ff;--ttx:#4a3fa0;--sc:#c4bfee;--bh:#6c5fca}
[data-theme="sakura"]{--bg-page:#fff5f7;--bg-panel:#fff;--bg-hdr:#fde8ec;--bg-in:#fffafb;--acc:#e0607e;--acc-s:#fde8ec;--acc-t:#a33155;--tp:#2d1520;--ts:#9b5566;--tm:#d4a0ab;--bd:#f5cdd5;--bf:#e0607e;--sh:0 6px 32px rgba(224,96,126,.14);--tbg:#fde8ec;--ttx:#a33155;--sc:#f3b8c5;--bh:#cc4d6e}
[data-theme="ocean"]{--bg-page:#eef7f9;--bg-panel:#fff;--bg-hdr:#d8eff4;--bg-in:#f7fdfe;--acc:#1d9e8f;--acc-s:#d8eff4;--acc-t:#0d6b61;--tp:#0f2b30;--ts:#3d7f87;--tm:#8fbfc5;--bd:#b9dde4;--bf:#1d9e8f;--sh:0 6px 32px rgba(29,158,143,.13);--tbg:#d8eff4;--ttx:#0d6b61;--sc:#9dd2d8;--bh:#168c7f}
[data-theme="harvest"]{--bg-page:#fdf6ec;--bg-panel:#fff;--bg-hdr:#fdecd4;--bg-in:#fffcf7;--acc:#d4810f;--acc-s:#fdecd4;--acc-t:#8c4f00;--tp:#241508;--ts:#a0662b;--tm:#d4b48a;--bd:#f0d9b5;--bf:#d4810f;--sh:0 6px 32px rgba(212,129,15,.13);--tbg:#fdecd4;--ttx:#8c4f00;--sc:#e9c490;--bh:#b86c0a}
[data-theme="sage"]{--bg-page:#f0f5ef;--bg-panel:#fff;--bg-hdr:#ddeedd;--bg-in:#f8faf7;--acc:#4a8c4a;--acc-s:#ddeedd;--acc-t:#2a5c2a;--tp:#111e11;--ts:#4a7050;--tm:#96bb96;--bd:#c0dbc0;--bf:#4a8c4a;--sh:0 6px 32px rgba(74,140,74,.12);--tbg:#ddeedd;--ttx:#2a5c2a;--sc:#a8cfa8;--bh:#3a7a3a}
[data-theme="midnight"]{--bg-page:#080d1a;--bg-panel:#0e1628;--bg-hdr:#111e36;--bg-in:#0b1220;--acc:#4db8ff;--acc-s:#0d2a42;--acc-t:#a8deff;--tp:#e8f4ff;--ts:#6fa8d0;--tm:#3a6080;--bd:#1e3a5c;--bf:#4db8ff;--sh:0 6px 32px rgba(77,184,255,.18);--tbg:#0d2a42;--ttx:#a8deff;--sc:#1e3a5c;--bh:#2aa4f4}
[data-theme="obsidian"]{--bg-page:#0d0b14;--bg-panel:#141120;--bg-hdr:#1a162c;--bg-in:#100e1c;--acc:#9c6fff;--acc-s:#1e1440;--acc-t:#cdb8ff;--tp:#f0ebff;--ts:#8a74c0;--tm:#4a3880;--bd:#2a2050;--bf:#9c6fff;--sh:0 6px 32px rgba(156,111,255,.2);--tbg:#1e1440;--ttx:#cdb8ff;--sc:#2a2050;--bh:#8558ee}
[data-theme="ember"]{--bg-page:#130a06;--bg-panel:#1e1009;--bg-hdr:#2a1508;--bg-in:#180d07;--acc:#ff6b35;--acc-s:#3a1500;--acc-t:#ffb494;--tp:#fff0e8;--ts:#c0805a;--tm:#7a4a30;--bd:#3a2018;--bf:#ff6b35;--sh:0 6px 32px rgba(255,107,53,.2);--tbg:#3a1500;--ttx:#ffb494;--sc:#3a2018;--bh:#e8521c}
[data-theme="forest"]{--bg-page:#060e08;--bg-panel:#0c1610;--bg-hdr:#101f14;--bg-in:#091009;--acc:#3dd68c;--acc-s:#0a2b18;--acc-t:#92f0c0;--tp:#e8fff2;--ts:#5aad7c;--tm:#2a6840;--bd:#1a3a24;--bf:#3dd68c;--sh:0 6px 32px rgba(61,214,140,.16);--tbg:#0a2b18;--ttx:#92f0c0;--sc:#1a3a24;--bh:#28c476}
[data-theme="void"]{--bg-page:#050508;--bg-panel:#0c0c14;--bg-hdr:#12121e;--bg-in:#080810;--acc:#f050f8;--acc-s:#1e0a20;--acc-t:#f8a0fc;--tp:#f8f0ff;--ts:#a060b0;--tm:#503060;--bd:#1e1028;--bf:#f050f8;--sh:0 6px 32px rgba(240,80,248,.2);--tbg:#1e0a20;--ttx:#f8a0fc;--sc:#1e1028;--bh:#d030e0}

html,body{height:100%;font-family:var(--font-b);background:var(--bg-page);color:var(--tp);transition:background var(--tr),color var(--tr);overflow:hidden}

/* HEADER */
#hdr{background:var(--bg-hdr);border-bottom:1.5px solid var(--bd);padding:0 2rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;position:relative;z-index:200;transition:background var(--tr),border-color var(--tr)}

/* ── MOBILE: compact header + scrollable canvas ── */
@media (max-width:768px){
  html,body{height:100%;overflow:hidden}
  #hdr{padding:0 .75rem;height:52px;grid-template-columns:auto 1fr auto;gap:6px}
  #site-title{font-size:1.05rem}
  #site-sub{display:none}
  #t-lbl{display:none}
  #t-sel{min-width:96px;font-size:.73rem;padding:5px 22px 5px 8px}
  #welcome{margin:.5rem auto 0;width:calc(100% - 1.2rem);padding:.55rem .9rem;gap:8px}
  #w-ico{width:28px;height:28px;border-radius:7px}
  #w-ico svg{width:14px;height:14px}
  #w-txt h1{font-size:.85rem}
  #w-txt p{font-size:.65rem}
  /* Canvas: fixed height, scrollable — panels live inside it */
  #canvas{position:relative;margin:.5rem .5rem 0;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
  /* Keep panels absolute (JS positions them), just reduce minimums */
  .panel{min-width:240px;min-height:200px}
  .pttl{font-size:.82rem}
  .psub{display:none}
  .ptag{display:none}
  .bact{padding:4px 9px;font-size:.67rem}
  .bgh{padding:3px 7px;font-size:.65rem}
  /* Header: touch-action:none so dragging doesn't scroll the canvas */
  .phdr{touch-action:none}
  /* Resize handles: much larger touch targets */
  .rh-nw,.rh-ne,.rh-se,.rh-sw{width:32px;height:32px}
  .rh-n,.rh-s{height:22px;left:32px;right:32px}
  .rh-e,.rh-w{width:22px;top:32px;bottom:32px}
  .rh-nw::after,.rh-ne::after,.rh-se::after,.rh-sw::after{width:11px;height:11px;opacity:.75}
  .rh{touch-action:none}
  /* Visual bottom-center resize bar so users know they can resize */
  .rh-s{background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:0 0 6px 6px;bottom:-11px;display:flex;align-items:center;justify-content:center}
  .rh-s::before{content:'';width:32px;height:3px;border-radius:99px;background:var(--acc);opacity:.55}
}

/* ── LANDSCAPE MOBILE: same scrollable canvas, side-by-side panels ── */
@media (max-width:900px) and (orientation:landscape){
  html,body{height:100%;overflow:hidden}
  #hdr{padding:0 .75rem;height:46px}
  #site-title{font-size:.95rem}
  #site-sub{display:none}
  #welcome{display:none}
  #canvas{position:relative;margin:.4rem .5rem 0;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
  .panel{min-width:220px;min-height:180px}
  .phdr{touch-action:none}
  .rh{touch-action:none}
  .rh-nw,.rh-ne,.rh-se,.rh-sw{width:30px;height:30px}
  .rh-n,.rh-s{height:20px}
  .rh-e,.rh-w{width:20px}
}
#hdr-l{display:flex;align-items:center;gap:8px}
#hdr-c{display:flex;flex-direction:column;align-items:center;gap:1px}
#site-title{font-family:var(--font-d);font-size:1.5rem;font-weight:600;color:var(--tp);letter-spacing:-.02em;text-align:center;transition:color var(--tr)}
#site-sub{font-size:.64rem;font-weight:300;color:var(--tm);letter-spacing:.14em;text-transform:uppercase;text-align:center;transition:color var(--tr)}
#hdr-r{display:flex;align-items:center;justify-content:flex-end;gap:8px}
#t-lbl{font-size:.7rem;font-weight:500;color:var(--ts);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;transition:color var(--tr)}
#t-wrap{position:relative}
#t-sel{appearance:none;-webkit-appearance:none;background:var(--bg-panel);border:1.5px solid var(--bd);border-radius:10px;color:var(--tp);font-family:var(--font-b);font-size:.8rem;font-weight:500;padding:6px 30px 6px 11px;cursor:pointer;outline:none;min-width:148px;transition:border-color var(--tr),background var(--tr),color var(--tr)}
#t-sel:hover{border-color:var(--acc)}
#t-sel:focus{border-color:var(--bf);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
#t-sel option,#t-sel optgroup{background:var(--bg-panel);color:var(--tp)}
#t-chev{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--tm);font-size:.6rem}
#wdot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pd 2.6s infinite;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent);transition:background var(--tr),box-shadow var(--tr)}
@keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

/* WELCOME */
#welcome{margin:.9rem auto 0;max-width:680px;width:calc(100% - 3rem);padding:1rem 1.8rem;background:var(--bg-panel);border:1.5px solid var(--bd);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:var(--sh);transition:background var(--tr),border-color var(--tr),box-shadow var(--tr)}
#w-ico{width:40px;height:40px;border-radius:10px;background:var(--acc-s);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--tr),border-color var(--tr)}
#w-ico svg{width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#w-txt{text-align:center}
#w-txt h1{font-family:var(--font-d);font-size:1.18rem;font-weight:600;color:var(--tp);letter-spacing:-.02em;margin-bottom:2px;transition:color var(--tr)}
#w-txt p{font-size:.76rem;color:var(--ts);font-weight:300;transition:color var(--tr)}

/* CANVAS */
#canvas{position:relative;margin:.8rem 1.5rem 0;min-height:380px}

/* PANELS */
.panel{position:absolute;background:var(--bg-panel);border:1.5px solid var(--bd);border-radius:15px;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:320px;min-height:220px;overflow:visible;transition:background var(--tr),border-color var(--tr),box-shadow var(--tr);user-select:none}
.panel.focused{border-color:var(--bf);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent),var(--sh)}
.panel.dragging{opacity:.9;box-shadow:0 18px 52px color-mix(in srgb,var(--acc) 24%,transparent)}

/* Drag header */
.phdr{padding:.75rem 1.1rem;border-bottom:1.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:var(--bg-hdr);border-radius:13px 13px 0 0;cursor:grab;flex-shrink:0;transition:background var(--tr),border-color var(--tr)}
.phdr:active{cursor:grabbing}
.pttlg{display:flex;align-items:center;gap:8px;pointer-events:none}
.pico{width:26px;height:26px;border-radius:6px;background:var(--acc-s);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--tr),border-color var(--tr)}
.pico svg{width:12px;height:12px;stroke:var(--acc);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.pttl{font-family:var(--font-d);font-size:.88rem;font-weight:600;color:var(--tp);letter-spacing:-.01em;transition:color var(--tr)}
.psub{font-size:.61rem;color:var(--tm);font-weight:300;letter-spacing:.03em;transition:color var(--tr)}
.pacts{display:flex;align-items:center;gap:6px;pointer-events:all}
.ptag{font-size:.61rem;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--tbg);color:var(--ttx);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--bd);transition:background var(--tr),color var(--tr),border-color var(--tr)}
.bact{display:inline-flex;align-items:center;gap:4px;background:var(--acc);color:#fff;border:none;border-radius:7px;font-family:var(--font-b);font-size:.7rem;font-weight:500;padding:4px 11px;cursor:pointer;letter-spacing:.03em;transition:background .16s,transform .1s;white-space:nowrap}
.bact:hover{background:var(--bh)}.bact:active{transform:scale(.97)}
.bgh{display:inline-flex;align-items:center;gap:4px;background:transparent;color:var(--ts);border:1px solid var(--bd);border-radius:6px;font-family:var(--font-b);font-size:.68rem;font-weight:400;padding:3px 9px;cursor:pointer;transition:border-color .16s,color .16s,background .16s}
.bgh:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-s)}.bgh:active{transform:scale(.97)}

/* Textarea */
.pbody{flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:0 0 13px 13px}
.pta{flex:1;width:100%;background:var(--bg-in);color:var(--tp);border:none;outline:none;font-family:var(--font-m);font-size:.8rem;line-height:1.82;padding:1rem 1.2rem;resize:none;transition:background var(--tr),color var(--tr);border-radius:0 0 13px 13px;overflow:auto}
.pta::placeholder{color:var(--tm);font-style:italic;font-weight:300}
.pta::-webkit-scrollbar{width:5px}.pta::-webkit-scrollbar-track{background:transparent}.pta::-webkit-scrollbar-thumb{background:var(--sc);border-radius:999px}
.outa{color:var(--ts)}

/* Footer */
.pftr{padding:.45rem 1.1rem;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg-hdr);border-radius:0 0 13px 13px;transition:border-color var(--tr),background var(--tr)}
.fmeta{font-size:.62rem;color:var(--tm);font-weight:300;font-family:var(--font-m);transition:color var(--tr)}
.fctr{font-family:var(--font-m);font-size:.62rem;color:var(--tm);transition:color var(--tr)}

/* RESIZE HANDLES */
.rh{position:absolute;z-index:20}
.rh-nw{top:-6px;left:-6px;width:16px;height:16px;cursor:nw-resize}
.rh-ne{top:-6px;right:-6px;width:16px;height:16px;cursor:ne-resize}
.rh-se{bottom:-6px;right:-6px;width:16px;height:16px;cursor:se-resize}
.rh-sw{bottom:-6px;left:-6px;width:16px;height:16px;cursor:sw-resize}
.rh-n{top:-5px;left:16px;right:16px;height:10px;cursor:n-resize}
.rh-s{bottom:-5px;left:16px;right:16px;height:10px;cursor:s-resize}
.rh-e{right:-5px;top:16px;bottom:16px;width:10px;cursor:e-resize}
.rh-w{left:-5px;top:16px;bottom:16px;width:10px;cursor:w-resize}
.rh-nw::after,.rh-ne::after,.rh-se::after,.rh-sw::after{content:'';position:absolute;width:7px;height:7px;background:var(--acc);border-radius:50%;opacity:.4;transition:opacity .2s,background var(--tr)}
.rh-nw::after{bottom:1px;right:1px}.rh-ne::after{bottom:1px;left:1px}.rh-se::after{top:1px;left:1px}.rh-sw::after{top:1px;right:1px}
.panel:hover .rh-nw::after,.panel:hover .rh-ne::after,.panel:hover .rh-se::after,.panel:hover .rh-sw::after{opacity:1}


#btn-reset{display:inline-flex;align-items:center;gap:5px;background:transparent;color:var(--ts);border:1.5px solid var(--bd);border-radius:8px;font-family:var(--font-b);font-size:.7rem;font-weight:500;padding:5px 12px;cursor:pointer;letter-spacing:.03em;transition:border-color .16s,color .16s,background .16s}
#btn-reset:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-s)}
#btn-reset:active{transform:scale(.97)}
</style>
</head>
<body data-theme="aurora">

<!-- HEADER -->
<header id="hdr" role="banner">
  <div id="hdr-l">
    <div id="wdot" aria-hidden="true"></div>
    <button id="btn-reset" aria-label="Reset layout" onclick="resetLayout()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.75"/></svg>Reset Layout
    </button>
  </div>
  <div id="hdr-c">
    <span id="site-title">QueryStudio</span>
    <span id="site-sub">Intelligent Query Interface</span>
  </div>
  <div id="hdr-r">
    <span id="t-lbl">Theme</span>
    <div id="t-wrap">
      <select id="t-sel" name="theme-select" aria-label="Select theme">
        <optgroup label="✦ Light Themes">
          <option value="aurora" selected>✦ Aurora</option>
          <option value="sakura">✿ Sakura</option>
          <option value="ocean">〜 Ocean Breeze</option>
          <option value="harvest">⊕ Harvest</option>
          <option value="sage">⊛ Sage Garden</option>
        </optgroup>
        <optgroup label="◈ Dark Themes">
          <option value="midnight">◈ Midnight</option>
          <option value="obsidian">◆ Obsidian</option>
          <option value="ember">◉ Ember</option>
          <option value="forest">◍ Forest Night</option>
          <option value="void">⬡ The Void</option>
        </optgroup>
      </select>
      <span id="t-chev" aria-hidden="true">▼</span>
    </div>
  </div>
</header>

<!-- WELCOME -->
<section id="welcome" role="region" aria-label="Welcome">
  <div id="w-ico" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
  </div>
  <div id="w-txt">
    <h1>Welcome to QueryStudio</h1>
    <p>Drag panels by their header · Resize from any edge or corner · Switch themes top-right</p>
  </div>
</section>

<!-- CANVAS -->
<div id="canvas" role="main">
  <div id="canvas-sizer" style="position:absolute;width:1px;height:1px;pointer-events:none;top:0;left:0"></div>

  <!-- INPUT PANEL -->
  <article id="input-panel" class="panel" aria-label="Query input panel">
    <div class="rh rh-nw" data-dir="nw"></div><div class="rh rh-n" data-dir="n"></div>
    <div class="rh rh-ne" data-dir="ne"></div><div class="rh rh-e" data-dir="e"></div>
    <div class="rh rh-se" data-dir="se"></div><div class="rh rh-s" data-dir="s"></div>
    <div class="rh rh-sw" data-dir="sw"></div><div class="rh rh-w" data-dir="w"></div>
    <header class="phdr" id="in-hdr">
      <div class="pttlg">
        <div class="pico"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div>
        <div><div class="pttl" id="input-panel-title">Input Query</div><div class="psub">Write or paste your query</div></div>
      </div>
      <div class="pacts">
        <span class="ptag" id="input-tag">Input</span>
        <button id="btn-clear-in" class="bgh" name="clear-input" aria-label="Clear input" onclick="clearIn()">✕ Clear</button>
        <button id="btn-run" class="bact" name="submit-query" aria-label="Run query" onclick="handleRun()">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Run
        </button>
      </div>
    </header>
    <div class="pbody" id="input-panel-body">
      <textarea id="query-input" name="query-input" class="pta" aria-label="Query input" placeholder="// Enter your query here…" spellcheck="false" autocomplete="off" oninput="onInChange(this)"></textarea>
    </div>
    <footer class="pftr" id="input-panel-footer">
      <span class="fmeta" id="in-meta" role="status" aria-live="polite">Ready</span>
      <span class="fctr" id="in-ctr">0 chars</span>
    </footer>
  </article>

  <!-- OUTPUT PANEL -->
  <article id="output-panel" class="panel" aria-label="Query output panel">
    <div class="rh rh-nw" data-dir="nw"></div><div class="rh rh-n" data-dir="n"></div>
    <div class="rh rh-ne" data-dir="ne"></div><div class="rh rh-e" data-dir="e"></div>
    <div class="rh rh-se" data-dir="se"></div><div class="rh rh-s" data-dir="s"></div>
    <div class="rh rh-sw" data-dir="sw"></div><div class="rh rh-w" data-dir="w"></div>
    <header class="phdr" id="out-hdr">
      <div class="pttlg">
        <div class="pico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></div>
        <div><div class="pttl" id="output-panel-title">Output Result</div><div class="psub">Results appear here</div></div>
      </div>
      <div class="pacts">
        <span class="ptag" id="output-tag">Output</span>
        <button id="btn-copy" class="bgh" name="copy-output" aria-label="Copy output" onclick="copyOut()">⎘ Copy</button>
        <button id="btn-clear-out" class="bgh" name="clear-output" aria-label="Clear output" onclick="clearOut()">✕ Clear</button>
      </div>
    </header>
    <div class="pbody" id="output-panel-body">
        <div id="query-output" class="pta outa" aria-label="Query output" style="overflow-y:auto; white-space:pre-wrap; cursor:default;"></div>
    </div>
    <footer class="pftr" id="output-panel-footer">
      <span class="fmeta" id="out-meta" role="status" aria-live="polite">Awaiting input</span>
      <span class="fctr" id="out-ctr">0 chars</span>
    </footer>
  </article>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function(){
  /* THEME */
  const tSel=document.getElementById('t-sel');
  tSel.addEventListener('change',()=>{document.body.setAttribute('data-theme',tSel.value)});

  /* PANELS */
  const canvas=document.getElementById('canvas');
  const pIn=document.getElementById('input-panel'),pOut=document.getElementById('output-panel');
  const DESK_MIN_W=320,DESK_MIN_H=220,MOB_MIN_W=240,MOB_MIN_H=200;

  function isMobile(){return window.innerWidth<=768}
  function isLandMob(){return window.innerWidth<=900&&window.innerHeight<window.innerWidth&&window.innerWidth<=900}

  function updateCanvasHeight(){
    // Give canvas remaining screen height so panels have room
    const hdrH=document.getElementById('hdr').offsetHeight;
    const welH=(document.getElementById('welcome').offsetParent!==null)?document.getElementById('welcome').offsetHeight+parseInt(getComputedStyle(document.getElementById('welcome')).marginTop):0;
    const margin=isMobile()||isLandMob()?8:13;
    canvas.style.height=(window.innerHeight-hdrH-welH-margin*2)+'px';
  }

  function initPanels(){
    updateCanvasHeight();
    const cw=canvas.offsetWidth,ch=canvas.offsetHeight;
    if(isMobile()){
      // Portrait mobile: stacked vertically, full width
      const g=10,pw=cw-g*2,ph=Math.max(MOB_MIN_H,Math.floor((ch-g*3)/2));
      setR(pIn, g,g,pw,ph);
      setR(pOut,g,g+ph+g,pw,ph);
    } else if(isLandMob()){
      // Landscape mobile: side by side
      const g=8,pw=Math.max(MOB_MIN_W,Math.floor((cw-g*3)/2)),ph=Math.max(MOB_MIN_H,ch-g*2);
      setR(pIn, g,g,pw,ph);
      setR(pOut,pw+g*2,g,pw,ph);
    } else {
      // Desktop
      const g=18,pw=Math.max(DESK_MIN_W,Math.floor((cw-g*3)/2)),ph=Math.max(DESK_MIN_H,Math.floor(ch-g*2));
      setR(pIn, g,g,pw,ph);
      setR(pOut,pw+g*2,g,pw,ph);
    }
    updateCanvasSizer();
  }
  function setR(el,x,y,w,h){el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px'}

  function updateCanvasSizer(){
    // Absolutely-positioned panels don't expand the parent's scroll area.
    // Updating a sizer element lets the canvas know its real content bounds.
    const sizer=document.getElementById('canvas-sizer');
    if(!sizer)return;
    const panels=[pIn,pOut];
    const maxBottom=Math.max(...panels.map(p=>p.offsetTop+p.offsetHeight));
    const maxRight =Math.max(...panels.map(p=>p.offsetLeft+p.offsetWidth));
    sizer.style.height=(maxBottom+20)+'px';
    sizer.style.width =(maxRight +20)+'px';
  }

  /* DRAG — works on mouse and touch; touch-action:none on .phdr stops canvas scroll during drag */
  function drag(panel,handle){
    function start(cx,cy){
      // Offset by canvas scroll so position stays correct
      let ox=panel.offsetLeft,oy=panel.offsetTop,sx=cx,sy=cy;
      panel.classList.add('dragging');
      function mv(x,y){
        panel.style.left=(ox+x-sx)+'px';
        panel.style.top=(oy+y-sy)+'px';
      }
      function end(){
        panel.classList.remove('dragging');
        document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
        document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',te);
        updateCanvasSizer();
      }
      const mm=e=>mv(e.clientX,e.clientY),mu=end;
      const tm=e=>{e.preventDefault();const t=e.touches[0];mv(t.clientX,t.clientY)},te=end;
      document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
      document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',te);
    }
    handle.addEventListener('mousedown',e=>{if(e.target.closest('.pacts'))return;e.preventDefault();start(e.clientX,e.clientY)});
    handle.addEventListener('touchstart',e=>{if(e.target.closest('.pacts'))return;e.preventDefault();const t=e.touches[0];start(t.clientX,t.clientY)},{passive:false});
  }

  /* RESIZE — touch-action:none on .rh stops canvas scroll during resize */
  function resize(panel){
    const minW=()=>isMobile()||isLandMob()?MOB_MIN_W:DESK_MIN_W;
    const minH=()=>isMobile()||isLandMob()?MOB_MIN_H:DESK_MIN_H;
    panel.querySelectorAll('.rh').forEach(h=>{
      function startResize(sx,sy){
        const dir=h.dataset.dir;
        const ox=panel.offsetLeft,oy=panel.offsetTop,ow=panel.offsetWidth,oh=panel.offsetHeight;
        function mv(cx,cy){
          const dx=cx-sx,dy=cy-sy;
          let nl=ox,nt=oy,nw=ow,nh=oh;
          const mw=minW(),mh=minH();
          if(dir.includes('e'))nw=Math.max(mw,ow+dx);
          if(dir.includes('s'))nh=Math.max(mh,oh+dy);
          if(dir.includes('w')){nw=Math.max(mw,ow-dx);if(nw>mw)nl=ox+dx}
          if(dir.includes('n')){nh=Math.max(mh,oh-dy);if(nh>mh)nt=oy+dy}
          panel.style.left=nl+'px';panel.style.top=nt+'px';panel.style.width=nw+'px';panel.style.height=nh+'px';
        }
        const mm=e=>mv(e.clientX,e.clientY);
        const tm=e=>{e.preventDefault();const t=e.touches[0];mv(t.clientX,t.clientY)};
        function up(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',up);updateCanvasSizer()}
        document.addEventListener('mousemove',mm);document.addEventListener('mouseup',up);
        document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',up);
      }
      h.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();startResize(e.clientX,e.clientY)});
      h.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();const t=e.touches[0];startResize(t.clientX,t.clientY)},{passive:false});
    });
  }

  /* FOCUS */
  [pIn,pOut].forEach(p=>{
    p.addEventListener('mousedown',()=>{
      [pIn,pOut].forEach(x=>x.classList.remove('focused'));
      p.classList.add('focused');p.style.zIndex=10;
      (p===pIn?pOut:pIn).style.zIndex=5;
    });
    p.addEventListener('touchstart',()=>{
      [pIn,pOut].forEach(x=>x.classList.remove('focused'));
      p.classList.add('focused');p.style.zIndex=10;
      (p===pIn?pOut:pIn).style.zIndex=5;
    },{passive:true});
  });

  drag(pIn,document.getElementById('in-hdr'));
  drag(pOut,document.getElementById('out-hdr'));
  resize(pIn);resize(pOut);
  window.addEventListener('resize',initPanels);
  window.addEventListener('orientationchange',()=>setTimeout(initPanels,150));
  initPanels();

  window.resetLayout=function(){initPanels()};

  /* UI ACTIONS */
  const qIn=document.getElementById('query-input'),qOut=document.getElementById('query-output');
  const inM=document.getElementById('in-meta'),outM=document.getElementById('out-meta');
  const inC=document.getElementById('in-ctr'),outC=document.getElementById('out-ctr');

  window.onInChange=function(el){
    const v=el.value,c=v.length,w=v.trim()?v.trim().split(/\s+/).length:0;
    inC.textContent=c+' chars';inM.textContent=c>0?w+' word'+(w!==1?'s':''):'Ready';
  };
  window.handleRun=async function(){
    const v=qIn.value.trim();
    if(!v){qIn.focus();return}
    outM.textContent='Processing…';
    const user_query = document.getElementById('query-input').value;
    const output_ans = document.getElementById('query-output');
    
    try {
      const response = await fetch("/query",
        {
          "method": "POST",
          "headers": {
            "Content-Type": "application/json"
          },
          "body": JSON.stringify({"text": user_query})
        }
      )

      if (!response.ok) {
        throw new Error(`Server error: ${response.status}`);
      }

      const data = await response.json();
      console.log(data);

      /* 
      In Javascript we can access the values in a dictionary like this:
      data = {"text": "Hello World"}
      data.text = "Hello World" 
      */
      output_ans.innerHTML = marked.parse(data.text);

    } catch (error) {
      console.error(error);
    }
  };
  window.clearIn=function(){qIn.value='';window.onInChange(qIn);inM.textContent='Cleared';qIn.focus()};
  window.clearOut=function(){qOut.innerHTML='';outC.textContent='0 chars';outM.textContent='Awaiting input'};
  window.copyOut=function(){
    const v=qOut.innerText;
    if(!v){return}
    navigator.clipboard.writeText(v).then(()=>{
      const b=document.getElementById('btn-copy');b.textContent='✓ Copied!';
      setTimeout(()=>{b.textContent='⎘ Copy'},1800);
    });
  };
  qOut.addEventListener('input',()=>{const l=qOut.innerText.length;outC.textContent=l+' chars';outM.textContent=l>0?'Has output':'Awaiting input'});
})();
</script>
</body>
</html>
